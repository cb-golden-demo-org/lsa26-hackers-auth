name: Deploy Hacker News Auth to GKE

on:
  workflow_dispatch:
    inputs:
      artifact_url:
        required: true
        type: string
      artifact_id:
        required: false
        type: string
      environment:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/776612895557/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-traveldemo@cloudbees-sa-emea-demo.iam.gserviceaccount.com

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: cloudbees-core
          location: europe-west1-d
          project_id: cloudbees-sa-emea-demo

      - name: Deploy Auth to GKE
        env:
          ARTIFACT_URL: ${{ inputs.artifact_url }}
          NAMESPACE: ${{ inputs.environment }}
          PUBLIC_HOST: core.cloudbees.guru
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

          kubectl apply -f - <<EOF
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: hacker-news-auth
            namespace: ${NAMESPACE}
            labels:
              app: hacker-news-auth
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: hacker-news-auth
            template:
              metadata:
                labels:
                  app: hacker-news-auth
              spec:
                containers:
                - name: hacker-news-auth
                  image: ${ARTIFACT_URL}
                  imagePullPolicy: Always
                  ports:
                  - containerPort: 8080
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: hacker-news-auth-svc
            namespace: ${NAMESPACE}
          spec:
            selector:
              app: hacker-news-auth
            ports:
            - name: http
              port: 80
              targetPort: 8080
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: hacker-news-auth
            namespace: ${NAMESPACE}
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              kubernetes.io/ingress.class: nginx
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
              nginx.ingress.kubernetes.io/use-regex: "true"
              nginx.ingress.kubernetes.io/rewrite-target: /\$2
          spec:
            rules:
            - host: ${PUBLIC_HOST}
              http:
                paths:
                - path: /${NAMESPACE}/auth(/|$)(.*)
                  pathType: ImplementationSpecific
                  backend:
                    service:
                      name: hacker-news-auth-svc
                      port:
                        number: 80
          ---
          apiVersion: networking.k8s.io/v1
          kind: Ingress
          metadata:
            name: hacker-news-auth-double-prefix
            namespace: ${NAMESPACE}
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              kubernetes.io/ingress.class: nginx
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
              nginx.ingress.kubernetes.io/use-regex: "true"
              nginx.ingress.kubernetes.io/rewrite-target: /\$2
          spec:
            rules:
            - host: ${PUBLIC_HOST}
              http:
                paths:
                - path: /${NAMESPACE}/auth/${NAMESPACE}(/|$)(.*)
                  pathType: ImplementationSpecific
                  backend:
                    service:
                      name: hacker-news-auth-svc
                      port:
                        number: 80
          EOF

          kubectl rollout status deployment/hacker-news-auth -n "$NAMESPACE" --timeout=5m

      - name: Verify pods
        env:
          NAMESPACE: ${{ inputs.environment }}
        run: |
          kubectl get pods -n "$NAMESPACE" -l app=hacker-news-auth
